<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>You're in · The Nuci</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Fraunces:ital,opsz,wght@1,9..144,400;1,9..144,500&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#FBFBF8; --text:#1A211C; --secondary:#5C6660; --forest:#3E5A47; --sage:#6B8F71;
    --border:#E5E3DC; --card:#fff; }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Inter',-apple-system,sans-serif;background:var(--bg);color:var(--text);
    min-height:100vh;min-height:100svh;display:flex;flex-direction:column;align-items:center;
    padding:max(28px,7vh) 24px 24px;-webkit-font-smoothing:antialiased}
  .brand{font-size:1.15rem;letter-spacing:-.03em;margin-bottom:0;color:var(--text)}
  .brand span{color:var(--sage)}
  .wrap{width:100%;max-width:380px;text-align:center;margin:auto 0}
  .tick{width:60px;height:60px;border-radius:50%;background:rgba(107,143,113,.13);display:flex;
    align-items:center;justify-content:center;margin:0 auto 26px}
  .tick svg{width:28px;height:28px;stroke:var(--sage);fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
  h1{font-weight:400;font-size:2.32rem;letter-spacing:-.03em;line-height:1.05;margin-bottom:14px;color:var(--text)}
  h1 .accent{font-family:'Fraunces',Georgia,serif;font-style:italic;font-weight:400;color:var(--sage);font-size:2.61rem}
  p{font-size:.95rem;color:var(--secondary);line-height:1.55;margin-bottom:30px}
  button{width:100%;padding:15px;border:none;border-radius:15px;background:var(--forest);color:#fff;
    font-family:inherit;font-size:1rem;font-weight:500;cursor:pointer;transition:opacity .15s;
    box-shadow:0 8px 22px rgba(62,90,71,.2)}
  button:active{opacity:.82}
  .hidden{display:none}
</style>
</head>
<body>
  <div class="brand"><span>The</span> Nuci.</div>
  <div class="wrap">
    <div class="tick"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.2 4.2L19 7"/></svg></div>
    <h1>You're <span class="accent">in</span>.</h1>

    <!-- Phone -->
    <div id="phone" class="hidden">
      <p>Your account is ready.</p>
      <button onclick="goBack()">Take me back</button>
    </div>

    <!-- Desktop -->
    <div id="desktop" class="hidden">
      <p>Continue on your phone to finish.</p>
    </div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
  // NEW-STYLE CONFIRM LINK: the email now lands here directly with ?token_hash=... and the
  // verification happens on THIS page (no supabase.co redirect hop - that hop caused
  // "site can't be reached" on the first tap in mobile mail apps). Old-style links with
  // #access_token still work through the legacy path below.
  var q=new URLSearchParams(location.search);
  var th=q.get('token_hash');
  if(th){
    var ov=document.createElement('div');
    ov.id='cfOv';
    ov.style.cssText='position:fixed;inset:0;z-index:50;background:#F2F1EC;display:flex;align-items:center;justify-content:center;text-align:center;padding:32px;font-family:Inter,-apple-system,sans-serif';
    ov.innerHTML='<div><div style="width:44px;height:44px;border:4px solid rgba(62,90,71,.15);border-top-color:#3E5A47;border-radius:50%;margin:0 auto 16px;animation:cfsp 1s linear infinite"></div><div style="color:#5C6660;font-size:.95rem">Confirming your email…</div></div><style>@keyframes cfsp{to{transform:rotate(360deg)}}</style>';
    document.addEventListener('DOMContentLoaded',function(){ document.body.appendChild(ov); });
    var supa=window.supabase.createClient('https://dsuiqkcjfayazzvfwdqk.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRzdWlxa2NqZmF5YXp6dmZ3ZHFrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA3MTA3NDksImV4cCI6MjA5NjI4Njc0OX0.WFQe-Vs3tbCemGKvNF-aQd_a1THR9C8kww9hA-LCgbE');
    var tries=0;
    function verify(){
      tries++;
      supa.auth.verifyOtp({ token_hash: th, type:'signup' }).then(function(r){
        if(r && !r.error){ var o=document.getElementById('cfOv'); if(o) o.remove(); return; }
        fail(r&&r.error);
      }).catch(function(e){ fail(e); });
    }
    function fail(err){
      if(tries<2){ setTimeout(verify, 900); return; }   // transient network: one silent retry
      var o=document.getElementById('cfOv');
      if(o){ o.innerHTML='<div style="max-width:340px"><div style="font-size:1.2rem;color:#1A211C;margin-bottom:10px">This link was already used or has expired</div><div style="color:#5C6660;font-size:.9rem;line-height:1.5;margin-bottom:18px">If you already confirmed, just log in normally. Otherwise register again to get a fresh link.</div><a href="/app" style="display:inline-block;background:#3E5A47;color:#F2F1E9;text-decoration:none;padding:13px 24px;border-radius:14px;font-size:.95rem">Open The Nuci</a></div>'; }
    }
    if(document.readyState!=='loading'){ document.body.appendChild(ov); }
    verify();
  }
  var isPhone = /iPhone|Android.*Mobile|iPod/i.test(navigator.userAgent)
    || (('ontouchstart' in window) && Math.min(screen.width, screen.height) < 820);
  document.getElementById(isPhone ? 'phone' : 'desktop').classList.remove('hidden');
  window.goBack = function(){
    // Supabase puts the auth token either in the hash (#access_token=...) or in the query
    // (?code=... on the PKCE flow). Forward BOTH, otherwise the app opens without a session
    // and drops the user back at the start screen.
    var hash = window.location.hash || '';
    var qs = window.location.search || '';
    var extra = qs ? ('&' + qs.replace(/^\?/, '')) : '';
    window.location.href = '/app?resume=1' + extra + hash;
  };
})();
</script>
</body>
</html>
