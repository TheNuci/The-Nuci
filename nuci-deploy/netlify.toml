[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# The plan generator makes a full 7-day AI call which can take longer than the default 10s
# function limit. Give it the maximum synchronous budget so it isn't killed mid-generation
# (which was leaving users with the fallback template plan instead of a real one).
[functions."generate-plan"]
  timeout = 26

# The landing now lives INSIDE app.html (as the #screen-landing screen), so the whole
# site is one document: tapping "Get started" swaps screens instead of loading a new
# page. That matters because TikTok's in-app browser blocked the old landing -> app
# page load for iOS users whose default browser is Safari.
#
# "/" therefore serves app.html. force = true is required: without it the static
# index.html file would win over this rule. index.html is kept in the repo purely as a
# backup of the old standalone landing and is no longer served at "/".
# Ads and the TikTok bio link can keep pointing at plain thenuci.com.
[[redirects]]
  from = "/"
  to = "/app.html"
  status = 200
  force = true

# Clean URL for the app: /app (and its sub-paths) all serve app.html without changing
# the address bar (status 200 = rewrite, not redirect). This keeps the URL clean while
# leaving the Stripe return flow (which appends ?paid=true) fully intact.
[[redirects]]
  from = "/app"
  to = "/app.html"
  status = 200

# Admin dashboard - clean /admin path. The page itself is public but shows nothing
# without the THE_NUCI_DEBUG_KEY; all data comes from the key-protected admin-stats function.
[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

# Password reset page - works on phone AND desktop (people often reset on a computer).
# Served from the clean /reset path; the recovery token arrives in the URL hash.
[[redirects]]
  from = "/reset"
  to = "/reset.html"
  status = 200

# Email confirmation landing - clean /confirm path. Supabase redirects here after the user
# clicks the confirm link in their email; the session tokens arrive in the URL hash.
[[redirects]]
  from = "/confirm"
  to = "/confirm.html"
  status = 200

# ============ CACHING ============
# HTML must never be served stale: without this, phone browsers (Safari especially) keep
# showing an old app.html after a new deploy, so fixes appear to "not work".
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/app"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/confirm"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/reset"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# ============ SCHEDULED EMAIL JOBS ============
# Netlify runs these on a cron schedule (UTC). Each function decides internally
# whether a given user is actually due an email, so frequent runs are safe.
# Each table below appears exactly ONCE (TOML forbids duplicate tables) and carries both
# the schedule and the timeout. timeout = 26 gives every cron the maximum synchronous
# budget - the default 10s could kill a run mid-loop once there are more than a handful
# of users (weekly-emails makes an AI call per user). Each function also has an internal
# time-budget guard that stops cleanly and logs how many users were left over.

# Daily check-in reminder - runs hourly so it can hit each user's local evening
[functions."checkin-reminder"]
  schedule = "0 * * * *"
  timeout = 26

# Morning nudge - RETIRED Sep 2026. It sent a second daily email on top of the evening
# check-in, and the evening one is the one that does the work (it feeds the next day's plan).
# The file is left in the repo; with no schedule here it simply never runs.
# [functions."morning-nudge"]
#   schedule = "0 * * * *"
#   timeout = 26

# Weekly themed emails - RETIRED Sep 2026. Five themed emails a week was far too much on
# top of a daily check-in, and it overlapped with behaviour-tips, which does the educational
# job properly (explicit consent, one email a fortnight). It also had two targeting bugs: a
# finished plan still counted as "has a plan", so the Friday/Sunday mails went to people
# whose week ended months ago, and the Tuesday no-plan nudge skipped exactly the people it
# was written for. The file stays in the repo; with no schedule here it never runs.
# [functions."weekly-emails"]
#   schedule = "0 * * * *"
#   timeout = 26

# Abandoned cart - hourly. The three nudges fire at 20h, 27h and 5 days after signup, so the
# old every-5-minutes cadence ran 288 times a day to do the work of 24. The "15 minutes after
# signup" note that justified it was left over from before the free-day-one model.
[functions."abandoned-cart"]
  schedule = "0 * * * *"
  timeout = 26

# Educational tips (consent only) - weekly run, function enforces a 14-day gap.
# This is now the ONLY educational/marketing email. Tips are chosen by the pet's species.
[functions."behaviour-tips"]
  schedule = "0 9 * * 3"
  timeout = 26

# Weekly full-database backup, emailed as a gzip attachment - Sundays 03:00 UTC
[functions."backup-profiles"]
  schedule = "0 3 * * 0"
  timeout = 26
