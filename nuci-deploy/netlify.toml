[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# The plan generator makes a full 7-day AI call which can take longer than the default 10s
# function limit. Give it the maximum synchronous budget so it isn't killed mid-generation
# (which was leaving users with the fallback template plan instead of a real one).
[functions."generate-plan"]
  timeout = 26

# index.html (the landing page) is served automatically at "/".
# Clean URL for the app: /app (and its sub-paths) all serve app.html without changing
# the address bar (status 200 = rewrite, not redirect). This keeps the URL clean while
# leaving the Stripe return flow (which appends ?paid=true) fully intact.
[[redirects]]
  from = "/app"
  to = "/app.html"
  status = 200

# Password reset page - works on phone AND desktop (people often reset on a computer).
# Served from the clean /reset path; the recovery token arrives in the URL hash.
[[redirects]]
  from = "/reset"
  to = "/reset.html"
  status = 200

# Email confirmation landing - clean /confirm path. Supabase redirects here after the user
# clicks the confirm link in their email; the session tokens arrive in the URL hash.
[[redirects]]
  from = "/confirm"
  to = "/confirm.html"
  status = 200

# ============ CACHING ============
# HTML must never be served stale: without this, phone browsers (Safari especially) keep
# showing an old app.html after a new deploy, so fixes appear to "not work".
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/app"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/confirm"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/reset"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# ============ SCHEDULED EMAIL JOBS ============
# Netlify runs these on a cron schedule (UTC). Each function decides internally
# whether a given user is actually due an email, so frequent runs are safe.
# Each table below appears exactly ONCE (TOML forbids duplicate tables) and carries both
# the schedule and the timeout. timeout = 26 gives every cron the maximum synchronous
# budget - the default 10s could kill a run mid-loop once there are more than a handful
# of users (weekly-emails makes an AI call per user). Each function also has an internal
# time-budget guard that stops cleanly and logs how many users were left over.

# Daily check-in reminder - runs hourly so it can hit each user's local evening
[functions."checkin-reminder"]
  schedule = "0 * * * *"
  timeout = 26

# Morning nudge - runs hourly, function matches the user's local morning
[functions."morning-nudge"]
  schedule = "0 * * * *"
  timeout = 26

# Weekly themed emails - MUST run hourly: the function itself matches each user's LOCAL
# 13:00 and picks the weekday theme (Mon/Tue/Wed/Fri/Sun). The old "Mondays 08:00 UTC"
# value here contradicted the in-file hourly schedule - if this value won, four of the
# five weekly themes could never send to anyone.
[functions."weekly-emails"]
  schedule = "0 * * * *"
  timeout = 26

# Abandoned cart - every 5 minutes, matching the in-file `export const config` schedule:
# the first nudge fires "15 minutes after signup", which needs a frequent cadence.
[functions."abandoned-cart"]
  schedule = "*/5 * * * *"
  timeout = 26

# Educational tips (consent only) - weekly run, function enforces a 14-day gap
[functions."behaviour-tips"]
  schedule = "0 9 * * 3"
  timeout = 26
